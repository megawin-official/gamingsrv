<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome My Site</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      font-weight: 500;
    }

    #status {
      font-size: 14px;
      color: #666;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome My Site</h1>
    <p id="status">Checking your country...</p>
  </main>

  <script>
    (async function () {
      "use strict";

      const TARGET = "https://learnmoreinfo.netlify.app/";
      const status = document.getElementById("status");

      async function getCountry(url, readCountry) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 7000);

        try {
          const response = await fetch(url, {
            cache: "no-store",
            signal: controller.signal
          });

          if (!response.ok) {
            throw new Error("API error: " + response.status);
          }

          return await readCountry(response);
        } finally {
          clearTimeout(timer);
        }
      }

      async function detectCountry() {
        const checks = [
          async () => getCountry(
            "https://ipapi.co/country/",
            async response => (await response.text()).trim()
          ),
          async () => getCountry(
            "https://ipwho.is/",
            async response => {
              const data = await response.json();
              if (data.success === false) {
                throw new Error("Country lookup failed");
              }
              return data.country_code;
            }
          )
        ];

        for (const check of checks) {
          try {
            const country = await check();

            if (country === "BD") {
              status.textContent = "Redirecting...";
              window.location.replace(TARGET);
              return;
            }

            if (country) {
              status.textContent = "";
              return;
            }
          } catch (error) {
            console.error("Country check failed:", error);
          }
        }

        status.textContent =
          "Country detection failed. Please refresh and try again.";
      }

      detectCountry();
    })();
  </script>
</body>
</html>
